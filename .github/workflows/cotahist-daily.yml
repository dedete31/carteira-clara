name: Atualizar cotações COTAHIST

on:
  schedule:
    - cron: "0 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4

      - name: Baixar e processar o COTAHIST diário
        run: python3 tools/update_cotahist.py

      - name: Guardar o último feed compacto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza feed diário COTAHIST"
            git push
          fi

      - name: Preparar o site e o feed compacto
        run: |
          mkdir -p dist/data
          cp index.html app.js opportunities.js styles.css manifest.webmanifest sw.js dist/
          cp data/quotes.json dist/data/quotes.json

      - name: Preparar publicação no GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar o site atualizado
        uses: actions/deploy-pages@v4
